name: Release local-ai-transcribe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Calculate version and tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semver.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate next semantic version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: ${{ github.sha }}
          noNewCommitBehavior: current
          noVersionBumpBehavior: patch
      - name: Tag the release commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.semver.outputs.next }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  build:
    name: Build ${{ matrix.platform }} CLI
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            binary: local-ai-transcribe.exe
          - os: ubuntu-latest
            platform: linux-x64
            binary: local-ai-transcribe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: >-
          python -m pip install pytest pyinstaller numpy noisereduce
          webrtcvad-wheels av tqdm "huggingface_hub[hf_xet]" hf_xet
          openvino openvino-genai openvino-tokenizers
      - name: Test
        run: python -m pytest
      - name: Build executable
        run: python -m PyInstaller --clean local-ai-transcribe.spec
      - name: Check CLI
        run: ./dist/${{ matrix.binary }} --help
      - name: Package release asset
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'local-ai-transcribe-release'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'dist/${{ matrix.binary }}' $stage
          Copy-Item README.md $stage
          Copy-Item srt2txt.py $stage
          Get-ChildItem -File -Filter 'LICENSE*' | Copy-Item -Destination $stage
          $asset = 'local-ai-transcribe-${{ matrix.platform }}'
          if ('${{ runner.os }}' -eq 'Windows') {
            Compress-Archive -Path "$stage/*" -DestinationPath "$asset.zip"
          } else {
            tar -czf "$asset.tar.gz" -C $stage .
          }
      - uses: actions/upload-artifact@v4
        with:
          name: local-ai-transcribe-${{ matrix.platform }}
          path: |
            local-ai-transcribe-*.zip
            local-ai-transcribe-*.tar.gz

  release:
    name: Publish release and assets
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: local-ai-transcribe-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: local-ai-transcribe ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/local-ai-transcribe-windows-x64.zip
            release-assets/local-ai-transcribe-linux-x64.tar.gz
